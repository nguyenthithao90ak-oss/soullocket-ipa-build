<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoulLocket ✨ - Món Quà Tình Yêu Cao Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --gold-light: #F9D423;
            --gold-dark: #FF4E50;
            --primary-velvet: #7f1d1d;
            --secondary-velvet: #450a0a;
        }
        
        * {
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, transform, opacity;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }
        
        .title-font {
            font-family: 'Playfair Display', serif;
        }

        #gift-wrapper {
            perspective: 1500px;
        }

        .gift-box {
            width: 300px;
            height: 300px;
            position: relative;
            margin: 0 auto;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
        }

        .gift-box.opened {
            animation: none;
            transform: scale(0);
            opacity: 0;
            transition: all 0.5s ease-in;
        }

        .box-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75%;
            background: linear-gradient(135deg, var(--primary-velvet) 0%, var(--secondary-velvet) 100%);
            border-radius: 16px 16px 12px 12px;
            box-shadow: 
                0 40px 50px -20px rgba(0, 0, 0, 0.7),
                inset 0 10px 20px rgba(255,255,255,0.1),
                inset 0 -10px 30px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lid {
            position: absolute;
            top: 0;
            left: -2%;
            width: 104%;
            height: 40%;
            background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
            border-radius: 12px;
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.6);
            transform-origin: bottom center;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ribbon-v {
            position: absolute;
            top: 0;
            left: 50%;
            width: 40px;
            height: 100%;
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            transform: translateX(-50%);
            z-index: 40;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 0 15px rgba(252, 246, 186, 0.2);
        }

        .ribbon-h {
            position: absolute;
            top: 45%;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            z-index: 40;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 0 15px rgba(252, 246, 186, 0.2);
        }

        .bow {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            width: 120px;
            height: 120px;
        }

        .bow::before,
        .bow::after {
            content: '';
            position: absolute;
            top: 15px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #fcf6ba, #b38728);
            border-radius: 50% 10% 50% 10%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .bow::before { left: 5px; transform: rotate(-45deg); }
        .bow::after { right: 5px; transform: rotate(45deg); }

        .bow-center {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #fcf6ba, #aa771c);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: popIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        @keyframes popIn {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; filter: blur(10px); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
        }

        .confetti-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
        }
        
        .text-gradient-gold {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse {
            width: 60px; height: 60px;
            background: #bf953f;
            border-radius: 50%;
            animation: pulse-gold 1.5s infinite;
        }

        @keyframes pulse-gold {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(191, 149, 63, 0.4); }
            50% { transform: scale(1.1); opacity: 0.8; box-shadow: 0 0 30px 10px rgba(191, 149, 63, 0.2); }
            100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(191, 149, 63, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative text-slate-200">

    <div class="loading-screen" id="loader">
        <div class="pulse"></div>
    </div>

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(180,130,50,0.15)_0%,transparent_50%)] pointer-events-none"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_100%,rgba(225,29,72,0.1)_0%,transparent_60%)] pointer-events-none"></div>

    <div class="max-w-2xl mx-auto text-center px-6 relative z-10 w-full">
        
        <div class="mb-12 transition-all duration-700" id="header-text">
            <div class="inline-flex items-center gap-2 bg-white/5 backdrop-blur-md text-yellow-500 text-xs font-semibold px-5 py-2 rounded-full border border-white/10 uppercase tracking-[3px] mb-6 shadow-lg">
                ✨ Món quà từ SoulLocket ✨
            </div>
            <h1 class="title-font text-4xl md:text-6xl font-bold text-white tracking-tight leading-tight mb-4">
                Dành Riêng <br><span class="text-gradient-gold italic">Cho Bạn</span>
            </h1>
        </div>

        <div id="gift-wrapper" class="mb-8">
            <div id="gift-box" class="gift-box" onclick="openGift()">
                <div class="box-body">
                    <div class="w-full text-center">
                        <div class="text-5xl mb-2 filter drop-shadow-[0_0_15px_rgba(255,215,0,0.8)]" id="giftEmoji">🎁</div>
                    </div>
                </div>
                <div id="lid" class="lid"></div>
                <div class="ribbon-v"></div>
                <div class="ribbon-h"></div>
                <div class="bow"><div class="bow-center"></div></div>
            </div>
        </div>

        <div id="revealed-content" class="hidden relative z-20 -mt-10 opacity-0 transition-all duration-1000">
            <div class="glass-card rounded-[2rem] p-8 md:p-10 max-w-lg mx-auto">
                
                <div class="relative mb-8 rounded-[1.5rem] overflow-hidden shadow-[0_20px_40px_rgba(0,0,0,0.5)] group" id="photoFrame" style="display: none;">
                    <img src="" id="giftImage" alt="Kỷ niệm" class="w-full h-[250px] object-cover transition-transform duration-1000 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>
                    <div class="absolute bottom-5 left-5 right-5 text-left">
                        <p class="text-white/80 text-sm font-light tracking-wider uppercase mb-1" id="senderLabel">Gửi Người thương</p>
                        <p class="text-white font-semibold text-lg" id="giftLabel">Món quà bất ngờ 🥂</p>
                    </div>
                </div>

                <h2 class="text-3xl font-bold text-white title-font mb-4" id="fromNameHeader">You are amazing!</h2>
                <p class="text-slate-300 text-base leading-relaxed font-light mb-8" id="giftMessage">
                    Đang tải lời nhắn yêu thương...
                </p>
                
                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button onclick="location.reload()" 
                            class="py-3 px-8 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium rounded-full flex items-center justify-center gap-3 backdrop-blur-md transition-all">
                        <span class="text-xl">↺</span> Mở lại
                    </button>
                    <button onclick="closeGift()" 
                            class="py-3 px-8 bg-gradient-to-r from-[#bf953f] to-[#aa771c] hover:from-[#fcf6ba] hover:to-[#bf953f] text-slate-900 font-bold rounded-full flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(191,149,63,0.4)] transition-all">
                        <span class="text-xl">❤️</span> Cảm ơn
                    </button>
                </div>
            </div>
            <p class="mt-8 text-slate-500 text-xs uppercase tracking-[2px]">Tạo bởi SoulLocket App</p>
        </div>

        <p id="click-hint" class="text-slate-400 font-light text-sm mt-8 flex items-center justify-center gap-2 uppercase tracking-[2px]">
            Nhấn vào hộp quà <span class="inline-block animate-bounce text-yellow-500">↓</span>
        </p>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <script>
        let canvas, ctx, particles = [], animationFrame;
        
        class ConfettiParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height * 0.5 - 100;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 6 + 4;
                this.speedX = Math.random() * 6 - 3;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 8 - 4;
                this.color = ['#fcf6ba', '#bf953f', '#ffffff', '#e2e8f0', '#991b1b'][Math.floor(Math.random() * 5)];
                this.shape = Math.random() > 0.4 ? 'circle' : 'rect';
                this.opacity = Math.random() * 0.5 + 0.5;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX; this.rotation += this.rotationSpeed;
                this.speedY += 0.1; this.speedX *= 0.99;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.opacity; ctx.fillStyle = this.color;
                if (this.shape === 'rect') ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 1.5);
                else { ctx.beginPath(); ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2); ctx.fill(); }
                ctx.restore();
            }
        }
        
        function launchConfetti() {
            particles = []; for (let i = 0; i < 200; i++) particles.push(new ConfettiParticle());
            if (animationFrame) cancelAnimationFrame(animationFrame);
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillAlive = false;
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i]; p.update(); p.draw();
                    if (p.y < canvas.height + 50) stillAlive = true; else particles.splice(i, 1);
                }
                if (stillAlive) animationFrame = requestAnimationFrame(animate);
            }
            animate();
        }

        function getGiftData() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('gift');
            if (!token) return null;
            try {
                let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                const jsonStr = decodeURIComponent(escape(atob(base64)));
                return JSON.parse(jsonStr);
            } catch (e) { return null; }
        }

        function openGift() {
            const giftBox = document.getElementById('gift-box');
            const revealedContent = document.getElementById('revealed-content');
            const clickHint = document.getElementById('click-hint');
            const headerText = document.getElementById('header-text');
            
            giftBox.classList.add('opened');
            launchConfetti();
            
            clickHint.style.opacity = '0';
            headerText.style.opacity = '0';
            headerText.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                headerText.style.display = 'none';
                revealedContent.classList.remove('hidden');
                setTimeout(() => {
                    revealedContent.style.opacity = '1';
                    revealedContent.style.marginTop = '0';
                }, 50);
            }, 600);
        }

        function closeGift() {
            window.close();
            // Nếu không đóng được (trình duyệt chặn), thì thông báo
            setTimeout(() => {
                alert("Cảm ơn bạn đã nhận món quà tuyệt vời này! ❤️");
            }, 300);
        }

        window.onload = function() {
            canvas = document.getElementById('confetti-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const data = getGiftData();
            if (data) {
                const name = data.fromName || "Người thương";
                document.getElementById('senderLabel').innerText = 'Từ: ' + name;
                document.getElementById('fromNameHeader').innerText = name + ' gửi tặng bạn!';
                document.getElementById('giftMessage').innerText = data.msg || data.message || "Chúc bạn một ngày tràn đầy niềm vui!";
                
                if (data.img || data.imageUrl) {
                    document.getElementById('giftImage').src = data.img || data.imageUrl;
                    document.getElementById('photoFrame').style.display = 'block';
                }

                const emojis = {
                    'gift_box': '🎁', 'love_letter': '✉️', 'surprise_egg': '🥚',
                    'bubble_wrap': '🫧', 'scratch_reveal': '✨', 'happy_birthday': '🎂',
                    'your_heart': '❤️', 'lovely_turkey': '🍗', 'moon_wish': '🌙'
                };
                document.getElementById('giftEmoji').innerText = emojis[data.giftType] || '🎁';
            }

            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
            }, 1200);
        };
    </script>
</body>
</html>
