  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#702190"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#702190"
    theme_color: "#702190"

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: "assets/splash.png"
  android: true
  ios: true
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: "assets/splash_icon_android12.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/models/heart.obj
    - assets/docs/
    - assets/3d.html
    - assets/games/rhythm-tiles/
    - assets/images/
    - assets/images/interaction_stickers/
    - assets/images/interaction_stickers/custom/numbered/
    - assets/images/sticker_import/cutout/sheet_02/
    - assets/images/sticker_import/cutout/sheet_03/
    - assets/images/sticker_import/cutout/sheet_04/
    - assets/i18n/
    - assets/icon.png
    - assets/icon_foreground.png
    - assets/splash.png
    - assets/splash_icon.png
    - assets/splash_icon_rounded.png
    - assets/splash_icon_android12.png
    - assets/audio/soul_block/
    - assets/audio/soul_rhythm_reference/
    - assets/audio/soul_rhythm_reference/tutorial_songs/
    - assets/audio/soul_rhythm_reference/sfx/

